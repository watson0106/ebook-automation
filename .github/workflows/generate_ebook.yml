name: eBook生成

on:
  workflow_dispatch:
    inputs:
      book_title:
        description: '本のタイトル（例: 7つの習慣）'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install --upgrade google-genai ebooklib Pillow python-docx google-api-python-client google-auth

      - name: APIキー診断
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "=== 利用可能なモデル一覧 ==="
          curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if 'models' in d:
              for m in d['models']:
                  print(m.get('name',''))
          else:
              print('ERROR:', json.dumps(d, ensure_ascii=False))
          "

      - name: eBook生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOOK_TITLE: ${{ inputs.book_title }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python scripts/generate_ebook.py

      - name: 生成ファイルをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: ebook-${{ github.run_number }}
          path: output/
          retention-days: 30
